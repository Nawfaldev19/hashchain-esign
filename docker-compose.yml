# One command to run the production build: docker compose up --build
services:
  signoff_ledger:
    build: .
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      DATA_DIR: .data/pglite
      SEED_DEMO: 'true'
      LOG_LEVEL: info
    volumes:
      - signoff-ledger-data:/app/.data
    restart: unless-stopped

volumes:
  signoff-ledger-data:
